---
- name: Ensure the waybar config folder is created
  file:
    path: "{{ ansible_env.HOME }}/.config/waybar"
    state: directory
    owner: "{{ ansible_env.USER }}"
    mode: "0755"

- name: Deploy the waybar configs with symlink
  with_fileglob:
    - "files/*"
  file:
    src: "{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/waybar/{{ item | basename }}"
    state: link
