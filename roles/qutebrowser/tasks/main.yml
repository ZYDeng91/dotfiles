---
- name: Ensure the qutebrowser config folder is created
  file:
    path: "{{ ansible_env.HOME }}/.config/qutebrowser"
    state: directory
    owner: "{{ ansible_env.USER }}"
    mode: "0755"

- name: Deploy the qutebrowser config with symlink
  file:
    src: "{{ role_path }}/files/config.py"
    dest: "{{ ansible_env.HOME }}/.config/qutebrowser/config.py"
    state: link
